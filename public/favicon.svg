<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MathNest">
<!-- Simplified lockup. The four operators and the shell fragments of the full
     mark disappear below about 24px, so the favicon keeps only the nest, the
     egg, and one plus sign. Colours match the palette in app/globals.css:
     #2a56d6 blue, #8dcba9 egg (green 48% on white), #f0a413 yellow. -->
<rect width="48" height="48" rx="11" fill="#2a56d6"/>
<!-- Scaled about the centre so the nest tips stay clear of the rounded corners. -->
